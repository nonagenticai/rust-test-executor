# Platform cargo-deny policy for rust-repo-run (--config), used only when the repo
# has no deny.toml of its own (a repo's own deny.toml is honoured).
[graph]
all-features = false

[advisories]
# db-path defaults to $CARGO_HOME/advisory-dbs (fresh per run).
ignore = []

[licenses]
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "Unlicense",
    "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# publish = false crates are the repo's own code, not third-party licences.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
